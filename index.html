<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الرسوم البيانية التفاعلي</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --bg-color: #ecf0f1;
            --text-color: #333;
        }
        
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 15px;
            margin-top: 0;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px;
            color: var(--primary-color);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary-color);
            line-height: 1.6;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 12px;
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: right;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
        }

        .option-btn:hover:not(:disabled) {
            background: #f1f8ff;
            border-color: var(--secondary-color);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .option-btn.correct {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
            font-weight: bold;
        }

        .option-btn.wrong {
            background: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        .controls {
            text-align: center;
            margin-top: 25px;
            min-height: 50px;
        }

        .next-btn, .restart-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            transition: background 0.3s;
            font-weight: bold;
        }

        .next-btn:hover, .restart-btn:hover {
            background: #2980b9;
        }

        .results-container {
            text-align: center;
            display: none;
            padding: 30px 0;
        }

        .results-container h2 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 30px auto;
            border: 5px solid var(--secondary-color);
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            border-top: 2px dashed #bdc3c7;
        }

        @media (max-width: 600px) {
            .quiz-header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>اختبار الرسوم البيانية الشامل</h1>
        
        <div id="quiz-area">
            <div class="quiz-header">
                <span id="question-tracker">السؤال: 1 / 50</span>
                <span id="score-tracker">النتيجة: 0</span>
            </div>
            
            <div class="question-container">
                <div class="question-text" id="question-text">جاري التحميل...</div>
                <ul class="options-list" id="options-list">
                    <!-- Options will be injected here JS -->
                </ul>
            </div>
            
            <div class="controls">
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي</button>
            </div>
        </div>

        <div class="results-container" id="results-container">
            <h2>انتهى الاختبار!</h2>
            <div class="score-circle">
                <span id="final-score">0</span><span style="font-size:1.2rem; margin-right:5px;">/50</span>
            </div>
            <h3 id="feedback-message" style="color: var(--secondary-color); margin-bottom: 20px;"></h3>
            <button class="restart-btn" id="restart-btn" onclick="restartQuiz()" style="display: inline-block;">إعادة الاختبار</button>
        </div>

        <div class="footer">
            من إعداد قيس جازي
        </div>
    </div>

    <script>
        // Array of 50 Questions based on the PDF
        const questions = [
            { q: "ما هو الرسم البياني (Chart)؟", options: ["تمثيل مرئي للبيانات الرقمية", "جدول نصوص معقدة", "تطبيق لتعديل الصور", "نوع من أنواع الحواسيب"], a: 0 },
            { q: "أي من التالي يعتبر من أهداف الرسوم البيانية؟", options: ["تسهيل فهم البيانات", "إخفاء المعلومات", "زيادة حجم الملف", "حذف البيانات القديمة"], a: 0 },
            { q: "ماذا تتيح لك الرسوم البيانية بدلاً من الجداول المليئة بالأرقام؟", options: ["عرض البيانات بوضوح وبساطة", "قراءة نصوص أطول", "الاستغناء عن الأرقام تماماً", "تغيير صحة البيانات"], a: 0 },
            { q: "هل تساعد الرسوم البيانية في اكتشاف الاتجاهات والأنماط؟", options: ["نعم، بشكل كبير", "لا، ليس لها علاقة", "فقط في الجداول النصية", "نادراً جداً"], a: 0 },
            { q: "كيف تفيد الرسوم البيانية صناع القرار؟", options: ["دعم اتخاذ القرارات", "تأخير اتخاذ القرار", "لا تؤثر على القرار", "إلغاء الحاجة للمديرين"], a: 0 },
            { q: "كم عدد أنواع الرسوم البيانية الرئيسية المذكورة في الشرح للإكسل؟", options: ["4 أنواع", "نوعان", "5 أنواع", "3 أنواع"], a: 0 },
            { q: "أي من التالي يعد من أنواع الرسوم البيانية في الإكسل؟", options: ["الرسم العمودي (Column Chart)", "الرسم التجريدي", "الرسم المعماري", "الرسم الجغرافي"], a: 0 },
            { q: "في الرسم العمودي، ماذا يمثل كل عمود؟", options: ["فئة (Category)", "لون عشوائي", "عنوان الرسم", "رقم الصفحة"], a: 0 },
            { q: "في الرسم العمودي، ماذا يمثل ارتفاع العمود؟", options: ["قيمة رقمية", "حجم النص", "أهمية الفئة", "وقت الإدخال"], a: 0 },
            { q: "متى نستخدم الرسم العمودي بشكل أساسي؟", options: ["لمقارنة القيم بين عناصر مختلفة", "لعرض نسبة 100%", "لإظهار خريطة جغرافية", "لكتابة ملاحظات نصية"], a: 0 },
            { q: "أي جزء يوضح موضوع البيانات المعروضة في الرسم؟", options: ["عنوان الرسم البياني", "المحور الأفقي", "المحور الرأسي", "مفتاح الرسم"], a: 0 },
            { q: "ماذا يمثل المحور الأفقي (X-Axis) عادة؟", options: ["الفئات مثل الأشهر أو الفروع", "القيم الرقمية فقط", "عنوان المخطط", "ألوان الأعمدة"], a: 0 },
            { q: "ماذا يمثل المحور الرأسي (Y-Axis) عادة؟", options: ["القيم الرقمية مثل المبيعات والأرباح", "أسماء الموظفين", "الأشهر والسنوات", "النسبة المئوية فقط"], a: 0 },
            { q: "ما هو الجزء الذي يوضح معنى الألوان أو الأعمدة في الرسم البياني؟", options: ["مفتاح الرسم (Legends)", "عنوان الرسم", "المحور الأفقي", "تسميات البيانات"], a: 0 },
            { q: "هل تسميات البيانات (Data Labels) إجبارية في كل رسم بياني؟", options: ["لا، هي اختيارية لزيادة الوضوح", "نعم، يجب وضعها دائماً", "لا يمكن إضافتها أبداً", "نعم، فقط في الرسم الدائري"], a: 0 },
            { q: "ماذا تظهر تسميات البيانات (Data Labels)؟", options: ["القيمة الرقمية فوق كل عمود", "اسم منشئ الرسم", "تاريخ اليوم", "مصدر البيانات"], a: 0 },
            { q: "ماذا يسمى الرسم الذي يظهر تغير القيم عبر الزمن أو تسلسل معين؟", options: ["الرسم الخطي (Line Chart)", "الرسم العمودي", "الرسم الدائري", "الرسم المركب"], a: 0 },
            { q: "كيف يتم تمثيل القيم في الرسم الخطي؟", options: ["بنقاط مرتبطة بخطوط مستقيمة", "بأعمدة ملونة", "بدوائر متداخلة", "بمربعات ثلاثية الأبعاد"], a: 0 },
            { q: "ما هو الاستخدام الأساسي للرسم الخطي؟", options: ["تحليل الاتجاهات على مدى فترة زمنية", "مقارنة حصة المنتجات من 100%", "عرض النصوص الطويلة", "تنسيق الجداول"], a: 0 },
            { q: "ماذا يمثل الرسم الدائري (Pie Chart)؟", options: ["نسبة كل جزء من الكل (100%)", "التغير الزمني للمبيعات", "مقارنة بين عدة فروع بمرور الزمن", "متوسط درجات الطلاب"], a: 0 },
            { q: "في الرسم الدائري، ماذا يعكس حجم كل قطعة؟", options: ["نسبة الفئة من الإجمالي", "لون الفئة", "أهمية المنتج", "تاريخ الإضافة"], a: 0 },
            { q: "متى يكون الرسم الدائري الخيار الأفضل؟", options: ["لتوضيح الحصة النسبية لكل فئة بسهولة", "لإظهار التغيرات اليومية للأسهم", "لمقارنة مبيعات 50 فرعاً", "لعرض هيكل تنظيمي"], a: 0 },
            { q: "ما هو الرسم المركب (Combo Chart)؟", options: ["رسم يجمع بين نوعين أو أكثر من الرسوم", "رسم يحتوي على دوائر فقط", "رسم ثلاثي الأبعاد فقط", "نوع قديم من الرسوم"], a: 0 },
            { q: "متى نستخدم الرسم المركب؟", options: ["عند عرض بيانات بمقاييس أو أنماط مختلفة", "عندما تكون البيانات نصية فقط", "لحذف البيانات المكررة", "لإخفاء المحور الرأسي"], a: 0 },
            { q: "في الرسم البياني للمبيعات (العمودي)، كم بلغت مبيعات شهر يناير؟", options: ["500 د.أ", "650 د.أ", "700 د.أ", "800 د.أ"], a: 0 },
            { q: "كم كانت مبيعات شهر فبراير في الرسم العمودي للمبيعات؟", options: ["650 د.أ", "500 د.أ", "750 د.أ", "900 د.أ"], a: 0 },
            { q: "كم كانت مبيعات شهر مارس في الرسم العمودي للمبيعات؟", options: ["700 د.أ", "600 د.أ", "800 د.أ", "400 د.أ"], a: 0 },
            { q: "في أي شهر بلغت المبيعات 600 د.أ في الرسم العمودي؟", options: ["ابريل", "يناير", "مايو", "يونيو"], a: 0 },
            { q: "ما هو الشهر الذي حقق أعلى مبيعات (800 د.أ) في الرسم العمودي؟", options: ["مايو", "مارس", "فبراير", "ابريل"], a: 0 },
            { q: "كم بلغت مبيعات شهر يونيو في الرسم العمودي؟", options: ["750 د.أ", "800 د.أ", "600 د.أ", "500 د.أ"], a: 0 },
            { q: "حسب جدول الفروع، كم كانت مبيعات فرع الزرقاء في شهر يناير؟", options: ["100 د.أ", "150 د.أ", "200 د.أ", "120 د.أ"], a: 0 },
            { q: "كم كانت مبيعات فرع اربد في شهر فبراير في الجدول؟", options: ["180 د.أ", "150 د.أ", "200 د.أ", "250 د.أ"], a: 0 },
            { q: "كم كانت مبيعات فرع عمان في شهر مارس؟", options: ["300 د.أ", "200 د.أ", "150 د.أ", "250 د.أ"], a: 0 },
            { q: "أي فرع حقق أعلى مبيعات في شهر مارس؟", options: ["فرع عمان", "فرع اربد", "فرع الزرقاء", "جميعهم متساوون"], a: 0 },
            { q: "كم كانت مبيعات فرع الزرقاء في شهر مارس؟", options: ["150 د.أ", "100 د.أ", "120 د.أ", "200 د.أ"], a: 0 },
            { q: "كم كانت مبيعات فرع اربد في شهر يناير؟", options: ["150 د.أ", "100 د.أ", "180 د.أ", "200 د.أ"], a: 0 },
            { q: "كم كانت مبيعات فرع عمان في شهر فبراير؟", options: ["250 د.أ", "200 د.أ", "300 د.أ", "180 د.أ"], a: 0 },
            { q: "في الرسم الدائري للمنتجات، كم بلغت مبيعات 'منتج A'؟", options: ["300 د.أ", "200 د.أ", "100 د.أ", "50 د.أ"], a: 0 },
            { q: "في الرسم الدائري للمنتجات، كم بلغت مبيعات 'منتج B'؟", options: ["200 د.أ", "100 د.أ", "300 د.أ", "50 د.أ"], a: 0 },
            { q: "أي منتج حقق مبيعات بقيمة 100 د.أ في الرسم الدائري؟", options: ["منتج C", "منتج A", "منتج B", "منتج D"], a: 0 },
            { q: "أي منتج يمثل الحصة الأصغر (50 د.أ) في الرسم الدائري؟", options: ["منتج D", "منتج A", "منتج B", "منتج C"], a: 0 },
            { q: "في المخططات، ماذا يسمى الخط الذي يمثل الفترات الزمنية؟", options: ["المحور الأفقي", "المحور العمودي", "مفتاح الرسم", "عنوان الرسم"], a: 0 },
            { q: "متى يكون استخدام مفتاح الرسم (Legends) ضرورياً جداً؟", options: ["عند وجود أكثر من سلسلة بيانات", "عند وجود سلسلة بيانات واحدة فقط", "في الرسم الدائري فقط", "لا يكون ضرورياً أبداً"], a: 0 },
            { q: "في مثال تعداد الحياة البرية (الرسم الدائري)، كم فئة تم عرضها؟", options: ["3 فئات", "فئتان", "4 فئات", "5 فئات"], a: 0 },
            { q: "في الرسم المركب (Combo Chart)، ما هما النوعان المدمجان في مثال (المبيعات والأرباح)؟", options: ["أعمدة وخطوط", "دائري وأعمدة", "خطي ودائري", "أعمدة فقط"], a: 0 },
            { q: "في مثال Combo Chart (المبيعات والأرباح)، ماذا يمثل الخط؟", options: ["الأرباح", "المبيعات", "الأشهر", "الفروع"], a: 0 },
            { q: "في نفس المثال (Combo Chart)، ماذا تمثل الأعمدة؟", options: ["المبيعات", "الأرباح", "التكاليف", "الضرائب"], a: 0 },
            { q: "من خلال الرسوم البيانية، ماذا يعني مصطلح (Categories)؟", options: ["الفئات", "القيم", "الألوان", "المحاور"], a: 0 },
            { q: "من خلال الرسوم البيانية، ماذا يعني مصطلح (Values)؟", options: ["القيم الرقمية", "الفئات", "النصوص", "التسميات"], a: 0 },
            { q: "ما هي الفائدة الرئيسية من (تبسيط البيانات المعقدة)؟", options: ["إيصال الفكرة بشكل أسرع", "إخفاء التفاصيل المهمة", "جعل الملفات أكبر حجماً", "صعوبة الطباعة"], a: 0 }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;

        const uiElements = {
            questionText: document.getElementById("question-text"),
            optionsList: document.getElementById("options-list"),
            nextBtn: document.getElementById("next-btn"),
            questionTracker: document.getElementById("question-tracker"),
            scoreTracker: document.getElementById("score-tracker"),
            quizArea: document.getElementById("quiz-area"),
            resultsContainer: document.getElementById("results-container"),
            finalScore: document.getElementById("final-score"),
            feedbackMessage: document.getElementById("feedback-message")
        };

        // Function to shuffle array securely
        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function loadQuestion() {
            hasAnswered = false;
            uiElements.nextBtn.style.display = "none";
            
            const currentQ = questions[currentQuestionIndex];
            
            uiElements.questionTracker.innerText = `السؤال: ${currentQuestionIndex + 1} / ${questions.length}`;
            uiElements.questionText.innerText = currentQ.q;
            uiElements.optionsList.innerHTML = "";
            
            // Format options to keep track of the correct one before shuffling
            let optionsWithStatus = currentQ.options.map((optText, index) => ({
                text: optText,
                isCorrect: index === currentQ.a
            }));
            
            optionsWithStatus = shuffleArray(optionsWithStatus);
            
            optionsWithStatus.forEach((option) => {
                const li = document.createElement("li");
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = option.text;
                
                // Set data attribute for programmatic checking
                if (option.isCorrect) {
                    btn.dataset.correct = "true";
                }
                
                btn.onclick = () => selectAnswer(btn, option.isCorrect);
                
                li.appendChild(btn);
                uiElements.optionsList.appendChild(li);
            });
        }

        function selectAnswer(selectedBtn, isCorrect) {
            if (hasAnswered) return;
            hasAnswered = true;

            const allButtons = document.querySelectorAll(".option-btn");
            
            allButtons.forEach(btn => {
                btn.disabled = true; // Disable all buttons
                // Highlight the correct answer no matter what the user chose
                if (btn.dataset.correct === "true") {
                    btn.classList.add("correct");
                }
            });

            if (isCorrect) {
                score++;
                uiElements.scoreTracker.innerText = `النتيجة: ${score}`;
            } else {
                // If user was wrong, highlight their choice as wrong
                selectedBtn.classList.add("wrong");
            }

            if (currentQuestionIndex < questions.length - 1) {
                uiElements.nextBtn.innerText = "السؤال التالي";
            } else {
                uiElements.nextBtn.innerText = "عرض النتيجة النهائية";
            }
            uiElements.nextBtn.style.display = "inline-block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            uiElements.quizArea.style.display = "none";
            uiElements.resultsContainer.style.display = "block";
            uiElements.finalScore.innerText = score;

            // Set feedback message based on score
            if (score === 50) {
                uiElements.feedbackMessage.innerText = "ممتاز! لقد أجبت على جميع الأسئلة بشكل صحيح.";
                uiElements.feedbackMessage.style.color = "var(--success-color)";
            } else if (score >= 40) {
                uiElements.feedbackMessage.innerText = "رائع جداً! معرفتك بالرسوم البيانية قوية.";
                uiElements.feedbackMessage.style.color = "var(--secondary-color)";
            } else if (score >= 25) {
                uiElements.feedbackMessage.innerText = "جيد! ولكن يمكنك مراجعة الملف لتحسين نتيجتك.";
                uiElements.feedbackMessage.style.color = "#f39c12";
            } else {
                uiElements.feedbackMessage.innerText = "حاول مرة أخرى بعد قراءة الملف بعناية أكبر.";
                uiElements.feedbackMessage.style.color = "var(--danger-color)";
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            uiElements.scoreTracker.innerText = `النتيجة: 0`;
            uiElements.quizArea.style.display = "block";
            uiElements.resultsContainer.style.display = "none";
            
            // Randomize questions array optionally (Uncomment below if you want questions in random order too)
            // questions = shuffleArray(questions);

            loadQuestion();
        }

        // Initialize Quiz
        loadQuestion();
    </script>
